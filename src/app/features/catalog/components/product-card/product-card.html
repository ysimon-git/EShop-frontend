<div class="card">
  <div class="row g-0">

    <div class="col-md-4">
      @if (getImageUrl()) {
        <img
          [src]="getImageUrl()"
          [alt]="product().name"
          class="product-image">
      }
    </div>

    <div class="col-md-8">
      <div class="card-body">

        <h5 class="card-title">
          {{ product().name }}
        </h5>

        <p class="card-text">
          {{ product().description }}
        </p>

        <div class="mb-3">
          <span class="badge bg-primary me-2">
            {{ product().categoryName }}
          </span>

          <span class="badge bg-secondary">
            {{ product().brandName }}
          </span>
        </div>

        <h5>{{ product().price }} €</h5>

        <div class="d-flex flex-column align-items-start mt-3">
              @if (getAvailableStock() > 0) {
                <span class="text-success">
                  En stock ({{ getAvailableStock() }})
                </span>
              } @else {
                <span class="text-danger">
                  Rupture de stock
                </span>
              }

              <button
                type="button"
                class="btn btn-primary mt-2"
                [disabled]="getAvailableStock() <= 0"
                (click)="addToBasket()">

                Ajouter au panier
              </button>
        </div>

      </div>
    </div>

  </div>
</div>
